{% extends "base.html" %}

{% block title %}Top 10 vulkāni{% endblock %}

{% block content %}

<h1>Top 10 lielākie vulkāni</h1>

{% for v in vulkani %}

<div class="block_vulkani">

    <a href="{{ url_for('delete', id=v.id) }}" class="delete-btn">✖</a>

    <a href="{{ url_for('vulkans', id=v.id) }}" class="card-link">

        <div class="text">
            <h2>{{ v.name }}</h2>
            <h3>{{ v.country }}</h3>
        </div>

        <div class="image">
            <img src="{{ url_for('static', filename='images/' + v.images) }}" alt="{{ v.name }}">
        </div>

    </a>

</div>

{% endfor %}

{% endblock %}
